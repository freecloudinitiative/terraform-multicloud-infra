name: "Terraform Plan"

on:
  pull_request:
    branches:
      - main

# One plan run per PR at a time; a new push cancels the previous run's plan
# since only the latest push's diff is useful. This is read-only, so it's
# safe to cancel/overlap with anything else (terraform-apply.yml's own
# per-provider concurrency group is what actually protects state).
concurrency:
  group: terraform-plan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  plan:
    name: "Plan"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform-plugin-cache

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"

      - name: Cache Terraform Plugins
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.terraform-plugin-cache
          key: ${{ runner.os }}-terraform-plan-${{ hashFiles('**/.terraform.lock.hcl') }}
          restore-keys: |
            ${{ runner.os }}-terraform-plan-

      # --- GCP ---
      - name: Authenticate to Google Cloud
        if: ${{ env.GCP_SA_KEY != '' }}
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Plan GCP
        working-directory: gcp
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          TF_VAR_gcp_project_id: ${{ secrets.GCP_PROJECT_ID }}
          TF_VAR_gcp_admin_ip_ranges: ${{ secrets.ADMIN_IP_RANGES }}
          TF_VAR_harbor_admin_password: ${{ secrets.HARBOR_ADMIN_PASSWORD }}
          TF_VAR_cluster_mode: simple
        run: |
          if [ -z "$GCP_SA_KEY" ]; then
            echo "GCP: skipped - GCP_SA_KEY not configured" | tee /tmp/plan-gcp.txt
            exit 0
          fi
          cat <<EOF > backend_ci.tf
          terraform {
            backend "gcs" {
              bucket = "tf-state-${{ secrets.GCP_PROJECT_ID }}"
              prefix = "terraform/state/gcp"
            }
          }
          EOF
          terraform init
          terraform plan -no-color -input=false | tee /tmp/plan-gcp.txt

      # --- AWS ---
      - name: Authenticate to AWS
        if: ${{ env.AWS_ACCESS_KEY_ID != '' }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Plan AWS
        working-directory: aws
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ]; then
            echo "AWS: skipped - AWS_ACCESS_KEY_ID not configured" | tee /tmp/plan-aws.txt
            exit 0
          fi
          cat <<EOF > backend_ci.tf
          terraform {
            backend "s3" {
              bucket       = "${{ secrets.AWS_TF_STATE_BUCKET }}"
              key          = "terraform/state/aws.tfstate"
              region       = "us-east-1"
              use_lockfile = true
            }
          }
          EOF
          terraform init
          terraform plan -no-color -input=false | tee /tmp/plan-aws.txt

      # --- Azure ---
      - name: Authenticate to Azure
        if: ${{ env.AZURE_CREDENTIALS != '' }}
        env:
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Plan Azure
        working-directory: azure
        env:
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
        run: |
          if [ -z "$AZURE_CREDENTIALS" ]; then
            echo "Azure: skipped - AZURE_CREDENTIALS not configured" | tee /tmp/plan-azure.txt
            exit 0
          fi
          cat <<EOF > backend_ci.tf
          terraform {
            backend "azurerm" {
              resource_group_name  = "${{ secrets.AZURE_TF_STATE_RG }}"
              storage_account_name = "${{ secrets.AZURE_TF_STATE_SA }}"
              container_name       = "tfstate"
              key                  = "terraform/state/azure.tfstate"
            }
          }
          EOF
          terraform init
          terraform plan -no-color -input=false | tee /tmp/plan-azure.txt

      - name: Comment plan on PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const read = (p) => fs.existsSync(p) ? fs.readFileSync(p, 'utf8').slice(-30000) : '(no output)';
            const gcp = read('/tmp/plan-gcp.txt');
            const aws = read('/tmp/plan-aws.txt');
            const azure = read('/tmp/plan-azure.txt');
            const section = (name, content) =>
              `<details><summary>${name}</summary>\n\n\`\`\`\n${content}\n\`\`\`\n</details>`;
            const body = `#### Terraform Plan\n${section('GCP', gcp)}\n${section('AWS', aws)}\n${section('Azure', azure)}`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.startsWith('#### Terraform Plan'));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
